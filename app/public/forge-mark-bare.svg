<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Icon-only, no container — for embedding on colored backgrounds -->
  <defs>
    <linearGradient id="fg2" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <!-- F mark: vertical stroke -->
  <rect x="11" y="10" width="4.5" height="20" rx="2.25" fill="url(#fg2)"/>
  <!-- F mark: top crossbar -->
  <rect x="11" y="10" width="14.5" height="4.5" rx="2.25" fill="url(#fg2)"/>
  <!-- F mark: middle crossbar -->
  <rect x="11" y="18.75" width="10.5" height="3.75" rx="1.875" fill="url(#fg2)"/>
  <!-- Spark dot -->
  <circle cx="28" cy="12.25" r="2.75" fill="#fb923c"/>
</svg>
