<svg viewBox="0 0 200 48" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif" fill="none">
  <defs>
    <linearGradient id="fl" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <!-- Mark: squircle 48x48 -->
  <rect x="0.5" y="0.5" width="47" height="47" rx="11" fill="#18181b"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="11" stroke="#f97316" stroke-width="0.75" stroke-opacity="0.35"/>

  <!-- F mark at native 40x40 scale, offset by 4px (centered in 48px = 4px padding) -->
  <rect x="15" y="13" width="5.4" height="24" rx="2.7" fill="url(#fl)"/>
  <rect x="15" y="13" width="17.4" height="5.4" rx="2.7" fill="url(#fl)"/>
  <rect x="15" y="24.5" width="12.6" height="4.5" rx="2.25" fill="url(#fl)"/>
  <!-- Spark -->
  <circle cx="35.2" cy="15.7" r="3.3" fill="#fb923c"/>

  <!-- Wordmark: "Forge" white + "OS" orange -->
  <text x="62" y="33" font-size="22" font-weight="700" letter-spacing="-0.5" fill="#fafafa">Forge</text>
  <text x="127" y="33" font-size="22" font-weight="700" letter-spacing="-0.5" fill="#f97316">OS</text>
</svg>
