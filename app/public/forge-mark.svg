<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="fg" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <radialGradient id="spark-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle background -->
  <rect x="0.5" y="0.5" width="39" height="39" rx="9.5" fill="#18181b"/>
  <!-- Subtle orange ring -->
  <rect x="0.5" y="0.5" width="39" height="39" rx="9.5" stroke="#f97316" stroke-width="0.75" stroke-opacity="0.35"/>

  <!-- F mark: vertical stroke -->
  <rect x="11" y="10" width="4.5" height="20" rx="2.25" fill="url(#fg)"/>
  <!-- F mark: top horizontal crossbar -->
  <rect x="11" y="10" width="14.5" height="4.5" rx="2.25" fill="url(#fg)"/>
  <!-- F mark: middle crossbar (shorter) -->
  <rect x="11" y="18.75" width="10.5" height="3.75" rx="1.875" fill="url(#fg)"/>

  <!-- Spark glow halo -->
  <circle cx="28" cy="12.25" r="5" fill="url(#spark-glow)"/>
  <!-- Spark dot — forge fire at end of top bar -->
  <circle cx="28" cy="12.25" r="2.75" fill="#fb923c"/>
</svg>
